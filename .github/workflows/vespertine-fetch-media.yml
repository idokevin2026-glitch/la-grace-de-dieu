name: Fetch VESPERTINE media into the repo

on:
  workflow_dispatch:
  push:
    branches: [claude/perfume-shop-website-qky6f2]
    paths:
      - '.github/workflows/vespertine-fetch-media.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/perfume-shop-website-qky6f2

      - name: Download the ORIGINAL renders
        run: |
          set -euo pipefail
          # generation CDN, the untouched model output rather than a web encode
          G=https://d8j0ntlcm91z4.cloudfront.net/user_3I2rrLtqnKASefbRbaeup4iaYjz
          mkdir -p vespertine/assets/media raw
          curl -fsSL "$G/hf_20260817_141542_14dc0515-ee7b-4147-92ca-d6ce59b0f9df.mp4" -o raw/vault.mp4
          curl -fsSL "$G/hf_20260817_140620_a9c7c8fa-d6fe-4bbd-a45f-e7039eb2d9fe.png" -o raw/vault-frame1.png
          curl -fsSL "$G/hf_20260817_143225_c24739a5-d8b3-44c8-9ee3-473b6260d087.png" -o raw/jasmine.png
          echo "--- source ---"
          ls -l raw
          ffprobe -v error -select_streams v -show_entries stream=width,height,bit_rate -of default=nw=1 raw/vault.mp4

      - name: Re-encode the scroll film at high quality
        run: |
          set -euo pipefail
          # 1600x900 with a lanczos scaler and gentle sharpening, encoded far above
          # the previous web pass so the compression mush goes away. Short GOP is
          # kept because scroll scrubbing seeks constantly.
          ffmpeg -v error -i raw/vault.mp4 -t 3.9 -an \
            -vf "scale=1600:900:flags=lanczos,unsharp=5:5:0.7:5:5:0.0" \
            -c:v libx264 -preset veryslow -crf 20 -g 8 -keyint_min 8 -sc_threshold 0 \
            -pix_fmt yuv420p -movflags +faststart \
            vespertine/assets/media/vault-scrub.mp4 -y

      - name: Rebuild the stills from the originals
        run: |
          set -euo pipefail
          # poster is frame one of the corridor, at full generated resolution
          ffmpeg -v error -i raw/vault-frame1.png -vf "scale=1920:-2:flags=lanczos" -q:v 2 \
            vespertine/assets/media/vault-poster.jpg -y
          # the resting frame, taken from the original film and sharpened to match
          ffmpeg -v error -ss 3.75 -i raw/vault.mp4 -frames:v 1 \
            -vf "scale=1920:-2:flags=lanczos,unsharp=5:5:0.7:5:5:0.0" -q:v 2 \
            vespertine/assets/media/bottle.jpg -y
          ffmpeg -v error -i raw/jasmine.png -vf "crop=ih*4/5:ih,scale=1200:-2:flags=lanczos" -q:v 3 \
            vespertine/assets/media/jasmine.jpg -y
          echo "--- shipped ---"
          ls -l vespertine/assets/media
          ffprobe -v error -select_streams v -show_entries stream=width,height,bit_rate -of default=nw=1 vespertine/assets/media/vault-scrub.mp4

      - name: Commit
        run: |
          set -euo pipefail
          rm -rf raw
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vespertine/assets/media
          git commit -m "Re-encode the scroll film from the original render at high quality" || echo "nothing to commit"
          git push origin HEAD:claude/perfume-shop-website-qky6f2

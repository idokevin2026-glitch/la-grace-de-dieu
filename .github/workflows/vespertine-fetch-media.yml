name: Fetch VESPERTINE media into the repo

on:
  workflow_dispatch:
  push:
    branches: [claude/perfume-shop-website-qky6f2]
    paths:
      - '.github/workflows/vespertine-fetch-media.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/perfume-shop-website-qky6f2

      - name: Download the media
        run: |
          set -euo pipefail
          # Everything here is already encoded for the web. The scroll film is
          # rebuilt from the original render at 1600x900 and 6.7 Mbps, roughly
          # three times the bitrate of the first pass, which is what removed the
          # soft, smeared look. GitHub runners cannot reach the generation CDN,
          # so the re-encode happens upstream and lands here.
          B=https://d2ol7oe51mr4n9.cloudfront.net/user_3I2rrLtqnKASefbRbaeup4iaYjz
          mkdir -p vespertine/assets/media
          curl -fsSL "$B/f11254ad-f8d5-4f4b-95b0-d85a940fda01.mp4" -o vespertine/assets/media/vault-scrub.mp4
          curl -fsSL "$B/329f9dd4-f4bc-4c4c-b1ef-5f1a0c346a76.jpg" -o vespertine/assets/media/bottle.jpg
          curl -fsSL "$B/36ea9349-0ddf-43b4-83eb-50708ab75c2d.jpg" -o vespertine/assets/media/vault-poster.jpg
          curl -fsSL "$B/e9fa3550-2eb4-45c3-86aa-e8029599592d.jpg" -o vespertine/assets/media/jasmine.jpg

      - name: Report what shipped
        run: |
          set -euo pipefail
          ls -l vespertine/assets/media
          ffprobe -v error -select_streams v -show_entries stream=width,height,bit_rate \
            -of default=nw=1 vespertine/assets/media/vault-scrub.mp4

      - name: Point the page at the local copies
        run: |
          set -euo pipefail
          F=vespertine/index.html
          sed -i 's|^var CDN = .*|var CDN = "assets/media/";|' "$F"
          sed -i 's|CDN + "[0-9a-f-]*\.mp4"|CDN + "vault-scrub.mp4"|' "$F"
          sed -i 's|CDN + "36ea9349-0ddf-43b4-83eb-50708ab75c2d.jpg"|CDN + "vault-poster.jpg"|' "$F"
          sed -i 's|CDN + "[0-9a-f-]*\.jpg"; // the resting frame|CDN + "bottle.jpg"; // the resting frame|' "$F"
          sed -i 's|CDN + "e9fa3550-2eb4-45c3-86aa-e8029599592d.jpg"|CDN + "jasmine.jpg"|' "$F"
          grep -n 'CDN + "' "$F" || true
          echo "remaining cloudfront refs:"; grep -c 'cloudfront' "$F" || true

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vespertine/assets/media vespertine/index.html
          git commit -m "Ship the high bitrate scroll film and sharper stills" || echo "nothing to commit"
          git push origin HEAD:claude/perfume-shop-website-qky6f2

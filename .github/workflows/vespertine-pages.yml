name: Deploy VESPERTINE site

on:
  push:
    branches: [claude/perfume-shop-website-qky6f2]
    paths:
      - 'vespertine/**'
      - '.github/workflows/vespertine-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is already switched on for this repository, so configure-pages
      # is not needed. Fewer actions to fetch also means fewer chances to hit
      # GitHub's action download rate limit.
      - uses: actions/checkout@v5

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: vespertine

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
